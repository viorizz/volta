name: CI et déploiement

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend
      - name: Backend — clippy et tests
        working-directory: backend
        env:
          SQLX_OFFLINE: "true"
        run: |
          cargo clippy --locked -- -D warnings
          cargo test --locked
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend — typage et build
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build

  deploy:
    needs: test
    # Ne déploie que depuis main, et seulement une fois le VPS configuré (variable VPS_HOST).
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.VPS_HOST != ''
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Image API
        uses: docker/build-push-action@v6
        with:
          context: backend
          load: true
          tags: volta-api:${{ github.sha }},volta-api:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Image web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          load: true
          tags: volta-web:${{ github.sha }},volta-web:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Exporter les images
        run: docker save volta-api:${{ github.sha }} volta-api:latest volta-web:${{ github.sha }} volta-web:latest | gzip > images.tar.gz

      - name: Clé SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Envoyer et redémarrer
        env:
          HOST: ${{ vars.VPS_HOST }}
          SHA: ${{ github.sha }}
        run: |
          scp images.tar.gz deploy/docker-compose.yml "deploy@$HOST:/opt/volta/"
          ssh "deploy@$HOST" "set -e; cd /opt/volta; mkdir -p tesla; if ! grep -q '^TOKEN_ENCRYPTION_KEY=' .env; then [ -z \"\$(tail -c1 .env)\" ] || echo >> .env; echo \"TOKEN_ENCRYPTION_KEY=\$(openssl rand -base64 32)\" >> .env; fi; gunzip -c images.tar.gz | docker load; rm images.tar.gz; VOLTA_VERSION=$SHA docker compose up -d --remove-orphans; docker image prune -f"

      - name: Vérifier que l'API répond
        env:
          HOST: ${{ vars.VPS_HOST }}
        run: |
          for i in $(seq 1 20); do
            ssh "deploy@$HOST" "docker compose -f /opt/volta/docker-compose.yml exec -T web wget -qO- http://api:8080/api/health" && exit 0
            sleep 3
          done
          echo "L'API ne répond pas"; exit 1
